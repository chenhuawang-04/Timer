name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Unit test and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install API 35
        shell: bash
        run: |
          # GitHub's bash shell enables `-e -o pipefail`. `sdkmanager` can
          # finish license acceptance successfully while `yes` receives SIGPIPE
          # and exits non-zero. Ignore only `yes`; still fail if sdkmanager fails.
          set +e
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          sdkmanager_license_status=${PIPESTATUS[1]}
          set -o pipefail
          set -e
          if [ "$sdkmanager_license_status" -ne 0 ]; then
            exit "$sdkmanager_license_status"
          fi
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and assemble debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: timer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
